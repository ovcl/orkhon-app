<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#0b1226"/>
      <stop offset="100%" stop-color="#141d33"/>
    </linearGradient>
    <radialGradient id="horizonGlow" cx="50%" cy="100%" r="75%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b2740"/>
      <stop offset="100%" stop-color="#141c30"/>
    </linearGradient>
    <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111a2e"/>
      <stop offset="100%" stop-color="#0c1322"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0f1c"/>
      <stop offset="100%" stop-color="#060a14"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>

  <!-- Одод -->
  <g fill="#e8ecf5" opacity="0.55">
    <circle cx="120" cy="90" r="1.4"/><circle cx="260" cy="180" r="1"/><circle cx="410" cy="70" r="1.6"/>
    <circle cx="560" cy="150" r="1"/><circle cx="700" cy="60" r="1.2"/><circle cx="860" cy="130" r="1.4"/>
    <circle cx="1010" cy="80" r="1"/><circle cx="1160" cy="170" r="1.3"/><circle cx="1320" cy="55" r="1"/>
    <circle cx="1470" cy="140" r="1.5"/><circle cx="1620" cy="90" r="1.1"/><circle cx="1780" cy="160" r="1.3"/>
    <circle cx="1850" cy="70" r="1"/><circle cx="60" cy="220" r="1"/><circle cx="960" cy="200" r="1.2"/>
  </g>

  <!-- Тэнгэрийн доод хэсгийн амбер сарнай -->
  <rect x="0" y="500" width="1920" height="580" fill="url(#horizonGlow)"/>

  <!-- Алс уулс (хамгийн зөөлөн давхарга) -->
  <path d="M0,620 C180,560 340,600 520,570 C700,540 860,600 1040,575 C1220,550 1380,610 1560,580 C1700,558 1820,590 1920,570 L1920,1080 L0,1080 Z" fill="url(#hillFar)" opacity="0.9"/>

  <!-- Дундаж уулс, нарийн topographic шугам -->
  <path d="M0,700 C160,650 300,690 460,660 C640,625 800,680 980,655 C1160,630 1320,690 1500,660 C1650,635 1800,670 1920,650 L1920,1080 L0,1080 Z" fill="url(#hillMid)"/>
  <g stroke="#3a4a6a" stroke-width="1" opacity="0.25" fill="none">
    <path d="M0,730 C200,700 380,725 560,700 C760,672 940,715 1140,695 C1340,672 1540,710 1920,690"/>
    <path d="M0,760 C220,735 400,755 600,732 C800,705 980,745 1180,725 C1400,700 1600,738 1920,718"/>
  </g>

  <!-- Ойрын уулс -->
  <path d="M0,820 C220,780 420,810 620,790 C820,768 1000,805 1220,788 C1420,770 1620,800 1920,782 L1920,1080 L0,1080 Z" fill="url(#hillNear)"/>

  <!-- Эрдэнэ Зуугийн 108 суваргат хана — гарын үсэг мэт дурсгал (silhouette) -->
  <g transform="translate(660,865)" opacity="0.9">
    <rect x="0" y="46" width="600" height="14" fill="#05070d"/>
    <g fill="#05070d">
      <!-- 12 жижиг суваргыг тэгш зайтай давтав -->
      <g id="stupaRow">
        <path d="M8,46 L8,34 C8,28 12,24 16,24 C20,24 24,28 24,34 L24,46 Z"/>
        <circle cx="16" cy="21" r="4"/>
        <rect x="14" y="10" width="4" height="9"/>
      </g>
    </g>
  </g>
  <g transform="translate(660,865)" fill="#05070d" opacity="0.9">
    <use href="#stupaRow" x="0"/><use href="#stupaRow" x="48"/><use href="#stupaRow" x="96"/>
    <use href="#stupaRow" x="144"/><use href="#stupaRow" x="192"/><use href="#stupaRow" x="240"/>
    <use href="#stupaRow" x="288"/><use href="#stupaRow" x="336"/><use href="#stupaRow" x="384"/>
    <use href="#stupaRow" x="432"/><use href="#stupaRow" x="480"/><use href="#stupaRow" x="528"/>
    <use href="#stupaRow" x="560"/>
  </g>

  <!-- Дурсгалт чулуу (буган чулуу) хос silhouette, хажуу талд -->
  <g fill="#05070d" opacity="0.92">
    <rect x="210" y="890" width="22" height="90" rx="3"/>
    <rect x="205" y="885" width="32" height="10" rx="2"/>
    <rect x="1660" y="880" width="22" height="100" rx="3"/>
    <rect x="1655" y="875" width="32" height="10" rx="2"/>
  </g>

  <!-- Хамгийн ойрын хөндийн шугам -->
  <path d="M0,960 C260,935 500,955 760,940 C1000,925 1240,950 1500,935 C1660,925 1800,940 1920,930 L1920,1080 L0,1080 Z" fill="#05070d"/>
</svg>
